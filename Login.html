<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Medicine Availability Finder</title>

    <link rel="stylesheet" href="Auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-left">
            <div class="logo">
                💊 Medicine <span>Finder</span>
            </div>

            <h1>Find Your Medicine<br>Near You</h1>

            <p>
                Search medicines, check availability,
                compare prices and find nearby pharmacies.
            </p>
        </div>


        <!-- Right Side -->
        <div class="auth-right">

            <div class="form-box">

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to your account
                </p>

                <form>

                    <label>Mobile Number</label>
                    <input
                        type="tel"
                        placeholder="Enter mobile number"
                        required
                    >

                    <label>Password</label>
                    <input
                        type="password"
                        placeholder="Enter password"
                        required
                    >

                    <div class="forgot">
                        <a href="ForgetPassword.html">Forgot Password?</a>
                    </div>

                    <button type="submit">
                        Login
                    </button>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <p class="register-text">
                    Don't have an account?
                    <a href="SignIn.html">Create Account</a>
                </p>

                <a href="Home.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
