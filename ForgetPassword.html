<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Medicine Finder</title>

    <link rel="stylesheet" href="Auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-left">
        <div class="logo">💊 Medicine Finder</div>

        <h1>Reset Your<br>Password</h1>

        <p>
            Enter your registered mobile number
            to receive an OTP and reset your password.
        </p>
    </div>


    <div class="auth-right">

        <div class="form-box">

            <h2>Forgot Password?</h2>

            <p class="subtitle">
                Enter your registered mobile number
            </p>

            <form action="VerifyOTP.html">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required
                >

                <button type="submit">
                    Send OTP
                </button>

            </form>

            <p class="register-text">
                Remember your password?
                <a href="Login.html">Login</a>
            </p>

            <a href="Home.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
